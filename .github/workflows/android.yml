name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses & Install SDK 36
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Ensure Valid Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          python3 -c "import base64; open('debug.keystore', 'wb').write(base64.b64decode(open('debug.keystore.base64').read().strip()))" 2>/dev/null || true
        fi
        if [ ! -f "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
          echo "Generating fresh valid debug.keystore..."
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace --no-configuration-cache

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TahajjudPulse-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
